# One workflow, not two: the point of this file is that `needs:` makes the
# gate *structural* — main cannot deploy without the checks having passed.
# A separate ci.yml could only ever run alongside the deploy, never in
# front of it.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the deploy job is granted the Pages
# tokens it actually needs.
permissions:
  contents: read

# Per-ref, so a second push to a branch supersedes the first. Deploy
# serialization is handled separately on that job — a `pages` group here
# would let PR runs and main deploys cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The committed measurement oracles (tests/). Offline and
      # deterministic — the Worker-dependent probes under scripts/probes/
      # are deliberately NOT run here: they need a live Worker and draw
      # real Workers AI quota.
      - run: npm test

  # Separate job so it runs in parallel with the app checks, and so a
  # Worker-only type error is legible as such. worker/ is its own
  # TypeScript project (excluded from the root tsconfig) and its typecheck
  # script previously existed without anything ever invoking it.
  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker

  build:
    needs: [checks, worker-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # The generation Worker (worker/) is deployed independently via
          # `wrangler deploy`, not by this workflow — see worker/README.md.
          # This only wires the client to its already-deployed URL. Public
          # URL, not a secret, so fork PRs build fine without repo secrets.
          NEXT_PUBLIC_LLM_ENDPOINT: "https://rag-playground-worker.abdulbosit-melikuziev.workers.dev"
      # PRs still run the full static export above — only the artifact
      # upload is skipped, since nothing will consume it.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Serialize deploys against each other without cancelling one midway —
    # a half-applied Pages deployment is worse than a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # v5 pairs with upload-pages-artifact@v5 and runs on Node 24 —
        # v4 was the source of the Node 20 deprecation warning.
        uses: actions/deploy-pages@v5
